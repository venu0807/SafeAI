name: SafeguardAI CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  python-validation:
    name: ML Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Syntax
        run: |
          python -m compileall -q ml/
          echo "✅ All ML and inference code compiled without syntax errors."

  web-build:
    name: Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Build Web Dashboard
        working-directory: web
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "mock-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mock-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock-project-id"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mock-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef"
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: "https://mock-project-id.firebaseio.com"
        run: |
          npm install --legacy-peer-deps
          npm run build
